apiVersion: v1
kind: Namespace
metadata:
  name: sage-policy-kwok
  labels:
    app.kubernetes.io/part-of: sage-resilient-urgent-scheduler
---
apiVersion: v1
kind: Pod
metadata:
  name: routine-image-sampler
  namespace: sage-policy-kwok
  labels:
    sagecontinuum.org/plugin-task: routine-image-sampler
    sagecontinuum.org/plugin-goal-id: goal-routine
    sagecontinuum.org/plugin-job-id: job-routine
spec:
  restartPolicy: Never
  nodeSelector:
    resource.gpu: "false"
  tolerations:
  - key: kwok.x-k8s.io/node
    operator: Exists
    effect: NoSchedule
  containers:
  - name: routine-image-sampler
    image: registry.k8s.io/pause:3.6
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: urgent-cloud-cover
  namespace: sage-policy-kwok
  labels:
    sagecontinuum.org/plugin-task: urgent-cloud-cover
    sagecontinuum.org/plugin-goal-id: goal-urgent
    sagecontinuum.org/plugin-job-id: job-urgent
spec:
  restartPolicy: Never
  nodeSelector:
    resource.gpu: "true"
  tolerations:
  - key: kwok.x-k8s.io/node
    operator: Exists
    effect: NoSchedule
  containers:
  - name: urgent-cloud-cover
    image: registry.k8s.io/pause:3.6
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
        nvidia.com/gpu: "1"
      limits:
        cpu: "1"
        memory: 512Mi
        nvidia.com/gpu: "1"
